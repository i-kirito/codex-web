name: PR checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require latest main unless trusted author
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          TRUSTED_BEHIND_AUTHORS: i-kirito
        run: |
          if [[ ",${TRUSTED_BEHIND_AUTHORS}," == *",${PR_AUTHOR},"* ]]; then
            echo "Trusted author ${PR_AUTHOR}: latest-main requirement skipped; all validation steps remain required."
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          if ! git merge-base --is-ancestor "origin/$BASE_REF" "$HEAD_SHA"; then
            echo "::error::PR 分支落后于 $BASE_REF，请先 rebase 到最新主分支。"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build and smoke-test Docker runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker build -t codex-web:ci .
          container=$(docker run --rm -d \
            -e CODEX_WEB_PASSWORD=ci-only-password \
            -e SESSION_SECRET=ci-only-isolated-session-secret \
            -e CODEX_BIN=/bin/false \
            -e IMAGE_PROMPT_AUTO_SYNC=false \
            -e PLAYGROUND_UPDATE_ENABLED=false \
            codex-web:ci)
          trap 'docker logs "$container"; docker stop "$container" >/dev/null || true' EXIT
          for attempt in {1..20}; do
            if docker exec "$container" curl -fsS http://127.0.0.1:36354/api/health; then
              break
            fi
            sleep 1
          done
          docker exec "$container" node --input-type=module -e '
            const base = "http://127.0.0.1:36354";
            const login = await fetch(base + "/api/login", {
              method: "POST", headers: {"content-type": "application/json"},
              body: JSON.stringify({password: "ci-only-password"}),
            });
            if (!login.ok) throw new Error(`Login failed: ${login.status}`);
            const cookie = login.headers.get("set-cookie").split(";")[0];
            const html = await (await fetch(base + "/", {headers: {cookie}})).text();
            const assets = [...html.matchAll(/(?:src|href)="(\/assets\/[a-f0-9]{64}\/[^"?]+)"/g)].map(match => match[1]);
            if (assets.length !== 5) throw new Error("Missing versioned page assets");
            for (const route of ["/", "/api/config", "/ui.css", "/effects.js", "/image-prompt.js", "/vendor/purify.js", ...assets]) {
              const response = await fetch(base + route, {headers: {cookie}});
              if (!response.ok) throw new Error(`${route}: ${response.status}`);
            }
          '

      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "origin/$BASE_REF...$HEAD_SHA"

  validate-required:
    name: validate-required
    if: always()
    needs:
      - validate
    runs-on: ubuntu-latest
    steps:
      - name: Require validation success
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [[ "$VALIDATE_RESULT" != "success" ]]; then
            echo "::error::validate job result: $VALIDATE_RESULT"
            exit 1
          fi
